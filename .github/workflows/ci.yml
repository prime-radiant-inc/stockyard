name: CI

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build server binaries
        run: make build-server

      - name: Build guest binaries
        run: make build-guest

      - name: Test
        run: make test

  # macOS compile + vet job: catches darwin-build-tag breakage that the
  # Linux runner silently skips (apple-container backend lives behind
  # //go:build darwin tags). Does NOT attempt an apple-container e2e —
  # Apple's `container` CLI needs macOS 26 / Tahoe and GH-hosted runners
  # don't ship that. The full e2e stays as a "controller drives it
  # locally before push" step. See PRI-1859.
  build-darwin:
    name: Build and Vet (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build (darwin)
        run: make build

      - name: Vet (darwin)
        run: go vet ./...

      - name: Test (darwin)
        run: make test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build client package
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -o stockyard ./cmd/stockyard
          tar czf stockyard-client-linux-${{ matrix.arch }}.tar.gz stockyard
          rm stockyard

      - name: Build server package
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -o stockyardd ./cmd/stockyardd
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -o stockyard ./cmd/stockyard
          tar czf stockyard-server-linux-${{ matrix.arch }}.tar.gz stockyardd stockyard
          rm stockyardd stockyard

      - name: Build guest package
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -o stockyard-shell ./cmd/stockyard-shell
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -o stockyard-snapshot ./cmd/stockyard-snapshot
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -o stockyard ./cmd/stockyard
          tar czf stockyard-guest-linux-${{ matrix.arch }}.tar.gz stockyard-shell stockyard-snapshot stockyard
          rm stockyard-shell stockyard-snapshot stockyard

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: stockyard-*-linux-${{ matrix.arch }}.tar.gz
