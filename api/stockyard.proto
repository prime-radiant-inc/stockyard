syntax = "proto3";

package stockyard.v1;

option go_package = "github.com/obra/stockyard/pkg/api/v1";

service Stockyard {
    rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
    rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
    rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
    rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
    rpc RestartTask(RestartTaskRequest) returns (RestartTaskResponse);
    rpc DestroyTask(DestroyTaskRequest) returns (DestroyTaskResponse);

    rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
    rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
    rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse);

    rpc GetLogs(GetLogsRequest) returns (stream LogEntry);

    rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
    rpc ImportImage(ImportImageRequest) returns (ImportImageResponse);
    rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);
}

message CreateTaskRequest {
    string name = 1;
    reserved 2;  // was: command
    map<string, string> vm_env = 3;  // VM-level env injected via cloud-init
    int32 cpus = 4;
    string memory = 5;
    bool no_tailscale = 6;
    string tailscale_auth_key = 7;  // Optional: override 1Password lookup
    repeated string ssh_authorized_keys = 8;  // SSH public keys for VM access
    bytes dotenv = 9;  // Raw .env file bytes for VM
    string image = 10;  // OCI image ref; empty = daemon default (PRI-2150)
}

message CreateTaskResponse {
    string task_id = 1;
    string tailscale_hostname = 2;
}

message GetTaskRequest {
    string task_id = 1;
}

message GetTaskResponse {
    Task task = 1;
}

message ListTasksRequest {
    string status = 1;
}

message ListTasksResponse {
    repeated Task tasks = 1;
}

message StopTaskRequest {
    string task_id = 1;
}

message StopTaskResponse {}

message RestartTaskRequest {
    string task_id = 1;
}

message RestartTaskResponse {}

message DestroyTaskRequest {
    string task_id = 1;
}

message DestroyTaskResponse {}

message CreateSnapshotRequest {
    string task_id = 1;
    string label = 2;
}

message CreateSnapshotResponse {
    string snapshot_name = 1;
}

message ListSnapshotsRequest {
    string task_id = 1;
}

message ListSnapshotsResponse {
    repeated Snapshot snapshots = 1;
}

message RestoreSnapshotRequest {
    string task_id = 1;
    string snapshot_name = 2;
}

message RestoreSnapshotResponse {}

message GetLogsRequest {
    string task_id = 1;
    bool follow = 2;
    int32 tail = 3;
}

message LogEntry {
    string timestamp = 1;
    string line = 2;
}

message Task {
    string id = 1;
    string name = 2;
    string status = 3;
    string tailscale_hostname = 4;
    string created_at = 5;
    string stopped_at = 6;
    string ip = 7;
    string backend = 8;
    string vm_id = 9;
    string image = 10;  // Resolved OCI image ref the task runs (PRI-2150)
}

message Snapshot {
    string name = 1;
    string label = 2;
    string created_at = 3;
}

message ListImagesRequest {}

message ListImagesResponse {
    repeated ImageInfo images = 1;
}

message ImageInfo {
    string reference = 1;   // OCI ref, as the store reports it
    string digest = 2;      // e.g. "sha256:48b0..."
    string size = 3;        // Human-readable ("4 MB"); display-only
    string created_at = 4;  // Best-effort; empty if the image carries no created annotation
}

message ImportImageRequest {
    string name = 1;         // Registry name (OCI-style ref)
    string rootfs_path = 2;  // Path on the daemon host
    string kernel_path = 3;  // Optional; empty = shared default kernel
}

message ImportImageResponse {}

message RemoveImageRequest {
    string name = 1;
}

message RemoveImageResponse {}
